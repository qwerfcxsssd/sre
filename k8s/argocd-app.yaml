apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/qwerfcxsssd/sre.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sre-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
