apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sre-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: sre-api:local
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: REDIS_HOST
              value: redis
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sre-demo
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
