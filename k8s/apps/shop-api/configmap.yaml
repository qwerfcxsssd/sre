apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-api-config
data:
  SHOP_LOG_LEVEL: "INFO"
  SHOP_POSTGRES_HOST: "postgres"
  SHOP_POSTGRES_PORT: "5432"
  SHOP_POSTGRES_DB: "sredb"
  SHOP_POSTGRES_POOL_SIZE: "10"
  SHOP_POSTGRES_MAX_OVERFLOW: "5"
  SHOP_REDIS_HOST: "redis"
  SHOP_REDIS_PORT: "6379"
  SHOP_REDIS_DB: "1"
  SHOP_CART_TTL_SECONDS: "1800"
  SHOP_SEED_PRODUCTS: "200"
  SHOP_QUEUE_KEY: "shop:jobs"
  SHOP_DEAD_LETTER_KEY: "shop:jobs:dead"
  SHOP_WORKER_POLL_SECONDS: "1.0"
  SHOP_WORKER_FAILURE_RATE: "0.03"
  SHOP_WORKER_MAX_ATTEMPTS: "3"
  SHOP_WORKER_MIN_DELAY_MS: "50"
  SHOP_WORKER_MAX_DELAY_MS: "400"
  SHOP_QUEUE_DEPTH_INTERVAL_SECONDS: "5.0"
  SHOP_DEPENDENCY_PROBE_INTERVAL_SECONDS: "10.0"
  SHOP_DB_POOL_INTERVAL_SECONDS: "5.0"
