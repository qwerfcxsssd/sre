apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sre-demo

labels:
  - pairs:
      app.kubernetes.io/part-of: shop-api
    includeSelectors: false

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - loadgen-configmap.yaml
  - loadgen-deployment.yaml

images:
  - name: ghcr.io/qwerfcxsssd/shop-api
    newTag: latest
